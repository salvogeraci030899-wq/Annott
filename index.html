<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIGHLIGHT AI — Core</title>
<style>
:root{--bg:#f6f3ee;--surface:#fff;--ink:#1b1815;--ink-3:#a8a29e;--border:#e6e0d6;--c-num:#ffe680;--c-name:#d9b8ff;--c-key:#b6e6b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.5}
.app{padding:16px;max-width:720px;margin:0 auto}
h1{font-size:1.1rem;margin:0 0 12px}
textarea{width:100%;height:120px;border:1px solid var(--border);border-radius:10px;padding:12px;font:inherit;background:var(--surface);resize:vertical;outline:none}
button{padding:10px 16px;border-radius:10px;border:none;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;font-size:.95rem;margin-top:8px}
button:active{transform:scale(.98)}
.output{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:12px;font-family:Georgia,serif;font-size:1.05rem;line-height:1.8;white-space:pre-wrap}
.output:empty{display:none}
mark{background:transparent;padding:1px 0;border-radius:3px}
mark.c-num{background:var(--c-num)}
mark.c-name{background:var(--c-name)}
mark.c-key{background:var(--c-key)}
.stats{margin-top:12px;font-size:.85rem;color:var(--ink-3)}
#err{color:#c0392b;font-family:monospace;font-size:12px;white-space:pre-wrap;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <h1>HIGHLIGHT AI — Core</h1>
  <textarea id="input" placeholder="Incolla un testo…">La Repubblica Italiana nacque il 2 giugno 1946. La Costituzione entrò in vigore il 1° gennaio 1948. Alcide De Gasperi guidò il primo governo repubblicano.</textarea>
  <button id="btn">Evidenzia</button>
  <div class="output" id="output"></div>
  <div class="stats" id="stats"></div>
  <div id="err"></div>
</div>

<script>
window.addEventListener('error', function(e){
  document.getElementById('err').textContent += '❌ ' + e.message + ' (linea ' + e.lineno + ')\n';
});

(function(){
  'use strict';

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Rilevatori semplici
  function findNumbers(text){
    var spans = [], m;
    var re = /(?<![\p{L}\p{M}])\d+(?:[.,]\d+)?(?:[°º])?(?:\s*%|\s+(?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre))?/giu;
    while ((m = re.exec(text)) !== null){
      spans.push({ start: m.index, end: m.index + m[0].length, cat: 'num' });
    }
    return spans;
  }

  function findProperNouns(text){
    var spans = [], m;
    var re = /(?:^|[.!?\n]\s+|(?<=[\s(«"']))([A-ZÀ-Ý][a-zà-ÿ]+(?:\s+[A-ZÀ-Ý][a-zà-ÿ]+)*)/g;
    while ((m = re.exec(text)) !== null){
      var word = m[1];
      if (!word || word.length < 3) continue;
      if (/^(Il|Lo|La|I|Gli|Le|Un|Uno|Una|E|Ed|O|Od|Ma|Che|Chi|Non|Si|Ci|Vi|Ne|Se|Di|Da|In|Con|Su|Per|Tra|Fra|Questo|Questa|Quello|Quella)$/.test(word)) continue;
      var start = m.index + m[0].indexOf(word);
      spans.push({ start: start, end: start + word.length, cat: 'name' });
    }
    return spans;
  }

  function findConcepts(text){
    var spans = [], freq = {}, tokens = [], m;
    var re = /[\p{L}][\p{L}'-]*/gu;
    while ((m = re.exec(text)) !== null){
      var lw = m[0].toLowerCase();
      if (lw.length < 6) continue;
      freq[lw] = (freq[lw] || 0) + 1;
      tokens.push({ word: m[0], lower: lw, start: m.index, end: m.index + m[0].length });
    }
    for (var i = 0; i < tokens.length; i++){
      if (freq[tokens[i].lower] >= 2) spans.push({ start: tokens[i].start, end: tokens[i].end, cat: 'key' });
    }
    return spans;
  }

  function buildRuns(text, spans){
    var owner = new Array(text.length).fill(null);
    var priority = { num: 3, name: 2, key: 1 };
    for (var i = 0; i < spans.length; i++){
      var s = spans[i];
      for (var p = s.start; p < s.end; p++){
        var cur = owner[p];
        if (!cur || priority[s.cat] > priority[cur]) owner[p] = s.cat;
      }
    }
    var runs = [], i2 = 0;
    while (i2 < text.length){
      if (!owner[i2]){ i2++; continue; }
      var cat = owner[i2], j = i2 + 1;
      while (j < text.length && owner[j] === cat) j++;
      runs.push({ start: i2, end: j, cat: cat });
      i2 = j;
    }
    return runs;
  }

  function render(text, spans){
    if (!spans.length) return esc(text);
    var runs = buildRuns(text, spans);
    var html = '', cursor = 0;
    for (var i = 0; i < runs.length; i++){
      var r = runs[i];
      if (r.start > cursor) html += esc(text.slice(cursor, r.start));
      var cls = r.cat === 'num' ? 'c-num' : (r.cat === 'name' ? 'c-name' : 'c-key');
      html += '<mark class="' + cls + '">' + esc(text.slice(r.start, r.end)) + '</mark>';
      cursor = r.end;
    }
    if (cursor < text.length) html += esc(text.slice(cursor));
    return html;
  }

  function analyze(){
    var text = $('input').value;
    if (!text.trim()){ $('output').innerHTML = ''; $('stats').textContent = ''; return; }
    var spans = [].concat(findNumbers(text), findProperNouns(text), findConcepts(text));
    $('output').innerHTML = render(text, spans);
    var counts = { num: 0, name: 0, key: 0 };
    for (var i = 0; i < spans.length; i++) counts[spans[i].cat]++;
    var words = (text.match(/\p{L}+/gu) || []).length;
    $('stats').textContent = words + ' parole · ' + counts.num + ' numeri · ' + counts.name + ' nomi · ' + counts.key + ' concetti';
  }

  $('btn').addEventListener('click', analyze);
  // Analizza all'avvio
  analyze();
})();
</script>
</body>
</html>
