<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Annota">
<title>Annota · lettura strutturata</title>
<style>
:root {
  --bg: #f6f3ee; --surface: #ffffff; --surface-2: #fbf9f5; --surface-3: #f1ede6;
  --ink: #1b1815; --ink-2: #57534e; --ink-3: #a8a29e;
  --border: #e6e0d6; --border-2: #d9d2c5;
  --accent: #b8893d; --accent-soft: #f3e6cf; --danger: #c0392b;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.10);
  --c-num:#ffe680; --c-name:#d9b8ff; --c-key:#b6e6b6;
  --c-quote:#ffc1cf; --c-list:#a9d8ff; --c-sentence:#ffc9a0;
}
[data-theme="dark"] {
  --bg:#14110f; --surface:#1e1a18; --surface-2:#262120; --surface-3:#2e2826;
  --ink:#f3efe9; --ink-2:#b6ada3; --ink-3:#6a635c;
  --border:#302a27; --border-2:#3d3632;
  --accent:#d4b478; --accent-soft:#3a2f1c; --danger:#e57373;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  --c-num:rgba(255,205,50,.45);
  --c-name:rgba(200,140,255,.42);
  --c-key:rgba(100,220,110,.38);
  --c-quote:rgba(255,140,175,.40);
  --c-list:rgba(80,170,255,.40);
  --c-sentence:rgba(255,165,90,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::selection{background:var(--accent-soft)}
.app{display:flex;flex-direction:column;min-height:100dvh;padding-top:env(safe-area-inset-top)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.02rem;letter-spacing:-0.01em}
.topbar .brand .dotlogo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--c-num),var(--c-list) 40%,var(--c-key) 70%,var(--c-sentence));box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.topbar .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s;flex:0 0 auto}
.iconbtn:active{background:var(--surface-3)}
.iconbtn svg{width:20px;height:20px}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 120px}
.wrap{max-width:720px;margin:0 auto}

.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;flex-direction:column}
.input-card textarea{width:100%;min-height:80px;height:140px;border:none;outline:none;resize:none;background:transparent;font-size:16px;line-height:1.55;color:var(--ink);display:block}
.input-card textarea::placeholder{color:var(--ink-3)}
.resize-handle{margin-top:8px;height:28px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;color:var(--ink-3);border-radius:8px;user-select:none;-webkit-user-select:none;transition:color .15s, background .15s}
.resize-handle:hover{color:var(--ink-2)}
.resize-handle.dragging{color:var(--accent);background:var(--surface-3)}
.resize-handle svg{width:26px;height:26px;pointer-events:none}

.actions{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
.btn{flex:1 1 auto;padding:13px 18px;border-radius:12px;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s;min-width:0}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ink);color:var(--bg);flex:1 1 auto}
.btn.primary:active{background:#000}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border-2)}
.btn.ghost:active{background:var(--surface-3)}
.btn.icon-only{flex:0 0 auto;width:52px;padding:13px 0}
.btn.danger-icon{color:var(--danger)}
.btn svg{width:17px;height:17px}
.btn.icon-only svg{width:20px;height:20px}

.cats-row{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 0 12px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats-row::-webkit-scrollbar{display:none}
.cat-pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:999px;font-size:.73rem;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--ink-2);transition:all .15s;white-space:nowrap;line-height:1;user-select:none;-webkit-user-select:none}
.cat-pill:active{transform:scale(.96)}
.cat-pill .dot{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);flex:0 0 auto}
.cat-pill.off{opacity:.38;text-decoration:line-through;text-decoration-thickness:1px}

.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 4px 8px;margin-bottom:4px}
.toolbar .spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;font-size:.82rem;font-weight:500;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);transition:background .15s,color .15s,transform .08s}
.tbtn:active{transform:scale(.97);background:var(--surface-3);color:var(--ink)}
.tbtn svg{width:15px;height:15px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.stat .k{font-size:.68rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stat .v{font-size:1.05rem;font-weight:700;margin-top:2px;letter-spacing:-0.01em}
.stat .v small{font-size:.72rem;font-weight:500;color:var(--ink-3);margin-left:3px}
.stat.warn .v{color:var(--danger)}
.stat.ok .v{color:#3b8f4b}
[data-theme="dark"] .stat.ok .v{color:#7bd88f}
.output-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 22px 26px;box-shadow:var(--shadow);font-family:"New York",Georgia,"Iowan Old Style","Times New Roman",serif;font-size:1.10rem;line-height:1.85;white-space:pre-wrap;word-wrap:break-word;color:var(--ink)}
.output-card:empty{display:none}
.output-card::selection,.output-card *::selection{background:var(--accent-soft)}
mark{background:transparent;color:inherit;padding:1px 0;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background .25s}
mark.c-num{background:var(--c-num)} mark.c-name{background:var(--c-name)}
mark.c-key{background:var(--c-key)} mark.c-quote{background:var(--c-quote)}
mark.c-list{background:var(--c-list)} mark.c-sentence{background:var(--c-sentence)}
.search-hit{background:#ff6b35 !important;color:white !important;border-radius:3px}
.search-hit.current{background:#d35400 !important;outline:2px solid #d35400}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.searchbar input{flex:1;border:none;outline:none;background:transparent;font-size:15px}
.searchbar .count{color:var(--ink-3);font-size:.82rem;min-width:40px;text-align:right}
.empty{text-align:center;padding:60px 24px;color:var(--ink-3)}
.empty .icon{font-size:2.6rem;margin-bottom:10px;opacity:.6}
.empty .title{color:var(--ink-2);font-weight:600;margin-bottom:4px}
.empty .sub{font-size:.9rem}
.lib-list{display:flex;flex-direction:column;gap:10px}
.lib-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:transform .08s,background .15s;cursor:pointer;box-shadow:var(--shadow)}
.lib-item:active{transform:scale(.99);background:var(--surface-2)}
.lib-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lib-item .badge{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.lib-item .date{font-size:.78rem;color:var(--ink-3);margin-left:auto}
.lib-item .title{font-weight:600;font-size:.98rem;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.lib-item .snippet{font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lib-item .meta{display:flex;gap:12px;margin-top:8px;font-size:.76rem;color:var(--ink-3)}
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;animation:slideUp .22s ease-out;border:1px solid var(--border);border-bottom:none}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 4px;font-size:1.05rem;letter-spacing:-0.01em}
.modal p{margin:0 0 16px;color:var(--ink-2);font-size:.9rem}
.modal .input-name{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border-2);background:var(--surface-2);font-size:16px;outline:none;margin-bottom:12px}
.modal .row-actions{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabbar{position:sticky;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .tab{flex:1;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:.68rem;font-weight:600;transition:color .15s}
.tabbar .tab svg{width:22px;height:22px}
.tabbar .tab.active{color:var(--accent)}
body.reading .topbar,body.reading .tabbar,body.reading .input-card,body.reading .actions,body.reading .toolbar,body.reading .cats-row,body.reading .stats,body.reading .searchbar{display:none !important}
body.reading .scroll{padding-top:10px}
body.reading .output-card{font-size:1.18rem;padding:24px 22px;border-radius:0;border:none;box-shadow:none;background:var(--bg)}
.reading-bar{display:none;position:sticky;top:0;z-index:40;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);align-items:center;gap:10px}
body.reading .reading-bar{display:flex}
.reading-bar .progress{flex:1;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.reading-bar .progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
@media (min-width:640px){.scroll{padding:22px 22px 120px}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="dotlogo"></span><span>Annota</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnTheme" title="Tema" aria-label="Cambia tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="iconbtn" id="btnShare" title="Condividi" aria-label="Condividi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    </button>
  </header>

  <section class="view active" id="view-annotate">
    <div class="reading-bar">
      <button class="iconbtn" id="btnExitReading" aria-label="Esci">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="progress"><i id="readProgress"></i></div>
      <button class="iconbtn" id="btnSearchReading" aria-label="Cerca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>

    <div class="scroll" id="scrollAnnotate">
      <div class="wrap">
        <div class="input-card">
          <textarea id="input" placeholder="Incolla qui il testo da annotare… (qualsiasi lingua)" spellcheck="false"></textarea>
          <div class="resize-handle" id="resizeHandle" title="Trascina per allungare" aria-label="Trascina per allungare">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="8 9 12 5 16 9"/><line x1="12" y1="5" x2="12" y2="19"/><polyline points="8 15 12 19 16 15"/>
            </svg>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="btnAnalyze">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>Annota</span>
          </button>
          <button class="btn ghost icon-only danger-icon" id="btnClear" title="Pulisci" aria-label="Pulisci">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>

        <div class="cats-row" id="legend"></div>
        <div class="stats" id="stats" style="display:none"></div>

        <div class="searchbar" id="searchBar" style="display:none">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--ink-3)"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" type="search" placeholder="Cerca nel testo…" autocomplete="off">
          <span class="count" id="searchCount"></span>
          <button class="iconbtn" id="btnSearchClose" style="width:30px;height:30px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="toolbar" id="toolbar">
          <div class="spacer"></div>
          <button class="tbtn" id="btnSaveLib">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Salva
          </button>
          <button class="tbtn" id="btnReading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            Lettura
          </button>
          <button class="tbtn" id="btnSearchOpen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Cerca
          </button>
          <button class="tbtn" id="btnCopy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copia
          </button>
        </div>

        <div class="output-card" id="output"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-library">
    <div class="scroll">
      <div class="wrap">
        <div class="searchbar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--ink-3)"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="libSearch" type="search" placeholder="Cerca nella libreria…" autocomplete="off">
        </div>
        <div class="lib-list" id="libList"></div>
        <div class="empty" id="libEmpty" style="display:none">
          <div class="icon">📚</div>
          <div class="title">Libreria vuota</div>
          <div class="sub">Salva un testo annotato per ritrovarlo qui, anche offline.</div>
        </div>
      </div>
    </div>
  </section>

  <nav class="tabbar">
    <button class="tab active" data-view="annotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      <span>Annota</span>
    </button>
    <button class="tab" data-view="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Libreria</span>
    </button>
  </nav>
</div>

<div class="modal-bg" id="modalSave">
  <div class="modal">
    <h3>Salva in libreria</h3>
    <p>Il testo annotato resterà sul tuo dispositivo, offline.</p>
    <input class="input-name" id="saveTitle" placeholder="Titolo (facoltativo)" autocomplete="off">
    <div class="row-actions">
      <button class="btn ghost" id="btnCancelSave">Annulla</button>
      <button class="btn primary" id="btnConfirmSave">Salva</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalConfirm">
  <div class="modal">
    <h3 id="confirmTitle">Sei sicuro?</h3>
    <p id="confirmText">Questa azione non può essere annullata.</p>
    <div class="row-actions">
      <button class="btn ghost" id="btnCancelConfirm">Annulla</button>
      <button class="btn primary danger" id="btnOkConfirm">Elimina</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeRE = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

let toastTimer = null;
function toast(msg, ms = 1800) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

function detectLanguage(text) {
  // Script cirillico → russo o ucraino
  const cyrillic = (text.match(/[\u0400-\u04FF]/g) || []).length;
  if (cyrillic > text.length * 0.10) {
    // Ucraino ha і, ї, є, ґ che il russo non ha
    const ukr = (text.match(/[іїєґ]/g) || []).length;
    return ukr > cyrillic * 0.03 ? 'uk' : 'ru';
  }
  // CJK, arabo, ebraico, thai, devanagari → non gestiti come lingua alfabetica
  if ((text.match(/[\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF]/g) || []).length > text.length * 0.10) return 'cjk';
  if ((text.match(/[\u0600-\u06FF]/g) || []).length > text.length * 0.10) return 'ar';
  if ((text.match(/[\u0590-\u05FF]/g) || []).length > text.length * 0.10) return 'he';
  if ((text.match(/[\u0E00-\u0E7F]/g) || []).length > text.length * 0.10) return 'th';
  if ((text.match(/[\u0900-\u097F]/g) || []).length > text.length * 0.10) return 'hi';

  const words = (text.toLowerCase().match(/\p{L}+/gu) || []).slice(0, 600);
  if (!words.length) return 'en';
  const wset = new Set(words);

  let best = 'it', bestScore = 0, secondBest = 0;
  for (const [lang, diag] of Object.entries(LANG_DETECT)) {
    let s = 0;
    for (const w of diag) if (wset.has(w)) s++;
    if (s > bestScore) { secondBest = bestScore; bestScore = s; best = lang; }
    else if (s > secondBest) secondBest = s;
  }
  // Se il margine è piccolo, torna inglese come fallback
  if (bestScore < 3) return 'en';
  if (bestScore < secondBest * 1.3 && bestScore < 6) return 'en';
  return best;
}

/* ---------------------------------------------------------------------
   TOKENIZZAZIONE UNIVERSALE (Unicode-aware)
--------------------------------------------------------------------- */
function tokenize(text) {
  const tokens = [];
  const re = /[\p{L}\p{M}][\p{L}\p{M}''\u2019\-]*/gu;
  let m;
  while ((m = re.exec(text)) !== null) {
    tokens.push({
      word: m[0],
      lower: m[0].toLowerCase(),
      start: m.index,
      end: m.index + m[0].length
    });
  }
  return tokens;
}

/* ---------------------------------------------------------------------
   PARAGRAFI E FRASI
--------------------------------------------------------------------- */
function findParagraphs(text) {
  const paras = [];
  let idx = 0;
  const re = /\n\s*\n/g;
  let m, start = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index > start) paras.push({ start, end: m.index });
    start = m.index + m[0].length;
  }
  if (start < text.length) paras.push({ start, end: text.length });
  // Filtra paragrafi troppo corti
  return paras.filter(p => p.end - p.start >= 15);
}

function findSentences(text, paras) {
  const sentences = [];
  for (const p of paras) {
    const re = /[.!?…。！？\u061F\u0964]+(?=\s|$)/g;
    re.lastIndex = 0;
    const slice = text.slice(p.start, p.end);
    let m, start = 0;
    while ((m = re.exec(slice)) !== null) {
      const end = m.index + m[0].length;
      if (end - start >= 15) {
        sentences.push({ start: p.start + start, end: p.start + end, paraStart: p.start, paraEnd: p.end });
      }
      start = end;
      while (start < slice.length && /\s/.test(slice[start])) start++;
    }
    if (slice.length - start >= 15) {
      sentences.push({ start: p.start + start, end: p.end, paraStart: p.start, paraEnd: p.end });
    }
  }
  return sentences;
}

/* ---------------------------------------------------------------------
   NUMERI E DATE — multilingua, multiscript
--------------------------------------------------------------------- */
const DIGIT_RANGES = '[0-9\u0660-\u0669\u06F0-\u06F9\u0966-\u096F\u09E6-\u09EF\u0E50-\u0E59\uFF10-\uFF19]';

function findNumbers(text) {
  const spans = [];
  const patterns = [
    // Numeri decimali (inclusi con separatori)
    new RegExp(`(?<![\\p{L}\\p{M}])${DIGIT_RANGES}+(?:[.,\\u066B\\u066C]${DIGIT_RANGES}+)*(?:\\s*%)?(?![\\p{L}\\p{M}])`, 'gu'),
    // Numeri romani lunghi (>= 3, per evitare falsi positivi)
    /(?<![\p{L}\p{M}])[IVXLCDM]{3,}(?![\p{L}\p{M}])/gu,
    // Intervalli e pagine: 12-14, pp. 34-56
    new RegExp(`${DIGIT_RANGES}+\\s*[-–—]\\s*${DIGIT_RANGES}+`, 'gu'),
    // Ordinali: 1°, 2°, 1º, 1ª, 3rd, 4th, 1er
    new RegExp(`${DIGIT_RANGES}+\\s*(?:°|º|ª|st|nd|rd|th|er|ème|ème|e|°)\\b`, 'giu')
  ];
  for (const re of patterns) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      spans.push({ start: m.index, end: m.index + m[0].length, cat: 'num', w: 5 });
      if (m[0].length === 0) re.lastIndex++;
    }
  }
  return spans;
}

/* ---------------------------------------------------------------------
   CITAZIONI — tutte le coppie di virgolette
--------------------------------------------------------------------- */
const QUOTE_PAIRS = [
  ['«','»'], ['‹','›'], ['「','」'], ['『','』'], ['⟨','⟩'],
  ['„','"'], ['‚','''], ['"','"'], ['"','"'], ['"','"'], ['"','"'],
  ['"','"'], ['\u2018','\u2019'], ['\u201C','\u201D']
];

function findQuotes(text) {
  const spans = [];
  for (const [open, close] of QUOTE_PAIRS) {
    if (open === close) {
      // Simmetriche: alterna apertura/chiusura
      let i = 0, openAt = -1;
      while (i < text.length) {
        if (text[i] === open) {
          if (openAt < 0) openAt = i;
          else {
            const len = i - openAt - 1;
            if (len >= 5 && len < 1500) spans.push({ start: openAt, end: i + 1, cat: 'quote', w: 5 });
            openAt = -1;
          }
        }
        i++;
      }
    } else {
      let idx = 0;
      while ((idx = text.indexOf(open, idx)) !== -1) {
        const closeIdx = text.indexOf(close, idx + 1);
        if (closeIdx === -1) break;
        const len = closeIdx - idx - 1;
        if (len >= 5 && len < 1500) spans.push({ start: idx, end: closeIdx + 1, cat: 'quote', w: 5 });
        idx = closeIdx + 1;
      }
    }
  }
  return spans;
}

/* ---------------------------------------------------------------------
   ELENCHI — tre pattern strutturali universali
   1. ":" seguito da lista separata da virgole
   2. righe che iniziano con bullet •, -, *, ·, –
   3. righe che iniziano con numerazione 1., 1), I., A.
--------------------------------------------------------------------- */
function findLists(text) {
  const spans = [];

  // 1) Liste con i due punti
  const colonRe = /[:：]/g;
  let m;
  while ((m = colonRe.exec(text)) !== null) {
    const startList = m.index + 1;
    let endList = startList;
    const maxEnd = Math.min(text.length, startList + 800);
    while (endList < maxEnd && !/[.;!?\n]/.test(text[endList])) endList++;
    if (endList - startList < 10) continue;
    const listText = text.slice(startList, endList);
    const sepCount = (listText.match(/[,;]/g) || []).length;
    if (sepCount < 1) continue;

    // Trigger
    let trigStart = m.index;
    while (trigStart > 0 && !/[.;!?\n]/.test(text[trigStart - 1])) trigStart--;
    while (trigStart < m.index && /\s/.test(text[trigStart])) trigStart++;
    if (m.index - trigStart >= 3) {
      spans.push({ start: trigStart, end: m.index + 1, cat: 'list', w: 4 });
    }

    // Elementi
    const seps = /[,;]\s*/g;
    let cur = 0, sep;
    const parts = [];
    while ((sep = seps.exec(listText)) !== null) {
      parts.push([cur, sep.index]);
      cur = sep.index + sep[0].length;
    }
    if (cur < listText.length) parts.push([cur, listText.length]);
    for (const [a, b] of parts) {
      let s = startList + a, e = startList + b;
      while (s < e && /\s/.test(text[s])) s++;
      while (e > s && /[\s,;]/.test(text[e - 1])) e--;
      if (e - s < 4 || e - s > 250) continue;
      spans.push({ start: s, end: e, cat: 'list', w: 4 });
    }
  }

  // 2) Bullet lists (righe che iniziano con •, -, *, ·, –, ▪, ▸)
  const bulletRe = /^[ \t]*[•·▪▸►\-–—*]\s+(.+)$/gm;
  while ((m = bulletRe.exec(text)) !== null) {
    const lineStart = m.index;
    const contentStart = lineStart + m[0].indexOf(m[1]);
    const contentEnd = contentStart + m[1].length;
    if (contentEnd - contentStart >= 3) {
      spans.push({ start: contentStart, end: contentEnd, cat: 'list', w: 4 });
    }
  }

  // 3) Liste numerate (1. / 1) / I. / A.)
  const numListRe = /^[ \t]*(?:\d{1,3}[.)]|[IVXLCDM]{1,4}[.)]|[A-Z][.)])\s+(.+)$/gm;
  while ((m = numListRe.exec(text)) !== null) {
    const contentStart = m.index + m[0].indexOf(m[1]);
    const contentEnd = contentStart + m[1].length;
    if (contentEnd - contentStart >= 3) {
      spans.push({ start: contentStart, end: contentEnd, cat: 'list', w: 4 });
    }
  }

  return spans;
}

/* ---------------------------------------------------------------------
   NOMI PROPRI
   - Sequenze di parole con iniziale maiuscola
   - Acronimi (tutte maiuscole, 2+ lettere)
   - Gestione connettori (of, de, di, van, von, del, della…)
--------------------------------------------------------------------- */
const NAME_CONNECTORS = new Set([
  'of','the','de','da','di','del','della','dei','degli','delle','van','von','der','den','dem',
  'des','la','le','les','los','las','el','al','bin','ibn','mac','mc','o','y','e','und','and'
]);

function findProperNouns(text, tokens, stopwords, lang) {
  if (lang === 'cjk' || lang === 'ar' || lang === 'he' || lang === 'th' || lang === 'hi') return [];
  const spans = [];
  const isStop = new Set(stopwords);

  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    const w = t.word;
    const c0 = w[0];
    const isCap = c0 === c0.toUpperCase() && c0 !== c0.toLowerCase();
    const isAllCaps = w.length >= 2 && w === w.toUpperCase() && /[A-ZÀ-Ý]/.test(w) && !/\d/.test(w);

    // Acronimi (ONU, NATO, USA)
    if (isAllCaps && !isStop.has(t.lower)) {
      spans.push({ start: t.start, end: t.end, cat: 'name', w: 4 });
      continue;
    }

    if (!isCap) continue;

    // Trova la sequenza completa (parole capitalizzate + connettori interni)
    let j = i;
    let lastCapIdx = i;
    while (j + 1 < tokens.length) {
      const next = tokens[j + 1];
      const between = text.slice(tokens[j].end, next.start);
      if (!/^[\s'’\-]{1,4}$/.test(between)) break;
      const nc = next.word[0];
      const nextIsCap = nc === nc.toUpperCase() && nc !== nc.toLowerCase();

      if (nextIsCap) {
        j++;
        lastCapIdx = j;
      } else if (NAME_CONNECTORS.has(next.lower) && j + 2 < tokens.length) {
        // Connettore interno (es. "of the", "de la"): guarda avanti
        const next2 = tokens[j + 2];
        const nc2 = next2.word[0];
        const next2IsCap = nc2 === nc2.toUpperCase() && nc2 !== nc2.toLowerCase();
        if (next2IsCap) { j += 2; lastCapIdx = j; }
        else break;
      } else break;
    }

    const endTok = tokens[lastCapIdx];
    const wordSpan = text.slice(t.start, endTok.end);
    const isMulti = lastCapIdx > i;

    // Siamo a inizio frase?
    const before = text.slice(0, t.start);
    const lastNonSpace = before.replace(/\s+$/, '');
    const atStart = !lastNonSpace || /[.!?…。！？:;"""«»""''(\[]\s*$/.test(lastNonSpace.slice(-2));

    const isStopWord = isStop.has(t.lower);

    // Regole di accettazione
    let accept = false;
    if (isMulti) accept = true;
    else if (!atStart && !isStopWord) accept = true;
    else if (atStart && !isStopWord && w.length >= 7) accept = true;
    else if (w.length >= 10) accept = true; // parole lunghe sono quasi sempre nomi propri

    if (accept) {
      spans.push({ start: t.start, end: endTok.end, cat: 'name', w: 4 });
    }
    i = lastCapIdx;
  }
  return spans;
}

/* ---------------------------------------------------------------------
   SALIENZA — punteggio multi-segnale
   Segnali: frequenza, lunghezza, posizione (inizio testo), densità
--------------------------------------------------------------------- */
function computeSalience(tokens, stopwords, sentences) {
  const isStop = new Set(stopwords);
  const freq = new Map();
  const firstPos = new Map();
  const total = tokens.length;

  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.word.length < 4) continue;
    if (isStop.has(t.lower)) continue;
    if (/^\d+$/.test(t.word)) continue;

    freq.set(t.lower, (freq.get(t.lower) || 0) + 1);
    if (!firstPos.has(t.lower)) firstPos.set(t.lower, i);
  }

  const isLong = total > 200;
  const salient = new Map();

  for (const [word, count] of freq) {
    const len = word.length;
    let score = 0;

    // Segnale 1: frequenza
    if (isLong) {
      if (count >= 4) score += 5;
      else if (count === 3) score += 3;
      else if (count === 2) score += 1.5;
    } else {
      if (count >= 2) score += 3;
    }

    // Segnale 2: lunghezza (termini tecnici specifici)
    if (len >= 10) score += 3;
    else if (len >= 8) score += 2;
    else if (len >= 6) score += 1;

    // Segnale 3: posizione precoce nel testo
    const pos = firstPos.get(word);
    if (pos < total * 0.15) score += 1;

    // Segnale 4: morfologia (suffissi comuni di nomi astratti)
    if (/(?:zione|sione|mento|ismo|ista|tà|tù|ezza|aggio|enza|anza|logia|grafia|nomia)$/.test(word)) score += 1.5;

    if (score >= 3) salient.set(word, score);
  }
  return salient;
}

/* ---------------------------------------------------------------------
   FRASI CHIAVE — punteggio basato su densità concettuale + posizione
--------------------------------------------------------------------- */
function findKeySentences(sentences, salient, tokens) {
  const spans = [];
  if (!salient.size) return spans;
  const tkn = tokens.slice().sort((a, b) => a.start - b.start);

  // Indicizza per paragrafo per sapere se la frase è prima/ultima
  const paraSentences = new Map();
  for (const s of sentences) {
    if (!paraSentences.has(s.paraStart)) paraSentences.set(s.paraStart, []);
    paraSentences.get(s.paraStart).push(s);
  }

  for (const s of sentences) {
    let conceptCount = 0, totalWords = 0;
    for (const t of tkn) {
      if (t.start < s.start) continue;
      if (t.start >= s.end) break;
      totalWords++;
      if (salient.has(t.lower)) conceptCount++;
    }
    if (totalWords < 6) continue;
    const density = conceptCount / totalWords;

    // Bonus se è la prima o l'ultima frase del paragrafo
    const siblings = paraSentences.get(s.paraStart) || [];
    const isFirst = siblings[0] === s;
    const isLast = siblings[siblings.length - 1] === s;

    let score = 0;
    if (conceptCount >= 4 && density >= 0.20) score = 3;
    else if (conceptCount >= 3 && density >= 0.25) score = 3;
    else if (conceptCount >= 3 && density >= 0.15 && (isFirst || isLast)) score = 3;

    if (score > 0) {
      spans.push({ start: s.start, end: s.end, cat: 'sentence', w: 2 });
    }
  }
  return spans;
}

/* ---------------------------------------------------------------------
   CONCETTI — evidenzia le singole parole salienti
--------------------------------------------------------------------- */
function findConceptSpans(tokens, salient) {
  const spans = [];
  for (const t of tokens) {
    if (!salient.has(t.lower)) continue;
    const score = salient.get(t.lower);
    const w = score >= 5 ? 3 : 2;
    spans.push({ start: t.start, end: t.end, cat: 'key', w });
  }
  return spans;
}

/* ---------------------------------------------------------------------
   ANALYZE
--------------------------------------------------------------------- */
function analyzeText(text) {
  if (!text.trim()) return { spans: [], lang: 'en', stats: {} };

  const lang = detectLanguage(text);
  const stopwords = STOP_WORDS[lang] || STOP_WORDS.en;

  const tokens = tokenize(text);
  const paragraphs = findParagraphs(text);
  const sentences = findSentences(text, paragraphs);
  const salient = computeSalience(tokens, stopwords, sentences);

  const spans = [];
  spans.push(...findNumbers(text));
  spans.push(...findQuotes(text));
  spans.push(...findLists(text));
  spans.push(...findProperNouns(text, tokens, stopwords, lang));
  spans.push(...findConceptSpans(tokens, salient));
  spans.push(...findKeySentences(sentences, salient, tokens));

  return {
    spans, lang,
    stats: {
      tokens: tokens.length,
      sentences: sentences.length,
      salient: salient.size
    }
  };
}

/* ---------------------------------------------------------------------
   OVERLAP RESOLUTION — priorità per peso
--------------------------------------------------------------------- */
function buildRuns(text, spans) {
  const n = text.length;
  const owner = new Uint16Array(n);
  const weight = new Uint8Array(n);
  const catIndex = {};

  for (const s of spans) {
    for (let i = s.start; i < s.end; i++) {
      if (s.w > weight[i]) {
        weight[i] = s.w;
        if (!catIndex[s.cat]) catIndex[s.cat] = Object.keys(catIndex).length + 1;
        owner[i] = catIndex[s.cat];
      }
    }
  }

  const runs = [];
  let i = 0;
  while (i < n) {
    if (!owner[i]) { i++; continue; }
    const cat = owner[i];
    let j = i + 1;
    while (j < n && owner[j] === cat) j++;
    runs.push({ start: i, end: j, catIdx: cat });
    i = j;
  }
  return { runs, catIndex };
}

function catIdFromIdx(catIndex, idx) {
  for (const [k, v] of Object.entries(catIndex)) if (v === idx) return k;
  return null;
}

const CAT_TO_CLASS = {
  num:'c-num', name:'c-name', key:'c-key',
  quote:'c-quote', list:'c-list', sentence:'c-sentence'
};

const CATEGORIES = [
  { id:'num',      label:'Numeri e date', color:'--c-num'      },
  { id:'name',     label:'Nomi propri',   color:'--c-name'     },
  { id:'key',      label:'Concetti',      color:'--c-key'      },
  { id:'quote',    label:'Citazioni',     color:'--c-quote'    },
  { id:'list',     label:'Elenchi',       color:'--c-list'     },
  { id:'sentence', label:'Frasi chiave',  color:'--c-sentence' }
];

function renderAnnotated(text, spans, activeCats) {
  if (!spans.length) return escapeHTML(text);
  const { runs, catIndex } = buildRuns(text, spans);
  if (!runs.length) return escapeHTML(text);

  let html = '';
  let cursor = 0;
  for (const r of runs) {
    if (r.start > cursor) html += escapeHTML(text.slice(cursor, r.start));
    const catId = catIdFromIdx(catIndex, r.catIdx);
    if (activeCats.has(catId)) {
      const cls = CAT_TO_CLASS[catId] || 'c-key';
      html += `<mark class="${cls}">${escapeHTML(text.slice(r.start, r.end))}</mark>`;
    } else {
      html += escapeHTML(text.slice(r.start, r.end));
    }
    cursor = r.end;
  }
  if (cursor < text.length) html += escapeHTML(text.slice(cursor));
  return html;
}

function computeCoverage(text, spans, activeCats) {
  if (!spans.length) return { pct: 0, count: 0 };
  const { runs, catIndex } = buildRuns(text, spans);
  let hlChars = 0, count = 0;
  for (const r of runs) {
    const catId = catIdFromIdx(catIndex, r.catIdx);
    if (activeCats.has(catId)) { hlChars += r.end - r.start; count++; }
  }
  return { pct: text.length ? Math.round(100 * hlChars / text.length) : 0, count };
}

const LIB_KEY = 'annota.library.v3';
const SES_KEY = 'annota.session.v3';

const INPUT_H_KEY = 'annota.inputHeight.v1';

function loadLibrary() { try { return JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch { return []; } }
function saveLibrary(list) { try { localStorage.setItem(LIB_KEY, JSON.stringify(list)); } catch { toast('Spazio esaurito'); } }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

const state = {
  text: '', activeCats: new Set(), spans: [], lang: 'en',
  library: loadLibrary(), view: 'annotate', currentLibId: null,
  searchHits: [], searchIdx: -1
};

try {
  const saved = JSON.parse(localStorage.getItem(CATS_KEY) || 'null');
  if (saved && Array.isArray(saved)) state.activeCats = new Set(saved);
} catch {}
if (!state.activeCats.size) state.activeCats = new Set(CATEGORIES.map(c => c.id));

function saveActiveCats() { try { localStorage.setItem(CATS_KEY, JSON.stringify([...state.activeCats])); } catch {} }

function renderLegend() {
  const box = $('legend');
  box.innerHTML = '';
  for (const c of CATEGORIES) {
    const el = document.createElement('button');
    el.className = 'cat-pill' + (state.activeCats.has(c.id) ? '' : ' off');

    el.addEventListener('click', () => {
      if (state.activeCats.has(c.id)) state.activeCats.delete(c.id);
      else state.activeCats.add(c.id);

      renderLegend();
      if (state.spans.length) { redrawOutput(); renderStats(); }
      vibrate(5);
    });
    box.appendChild(el);
  }
}

function runAnalyze() {
  const text = state.text;
  if (!text.trim()) {
    state.spans = [];
    $('output').innerHTML = '';
    $('stats').style.display = 'none';
    return;
  }
  const result = analyzeText(text);
  state.spans = result.spans;
  state.lang = result.lang;
  redrawOutput();
  renderStats();
  try { localStorage.setItem(SES_KEY, JSON.stringify({ text, ts: Date.now() })); } catch {}
}

function redrawOutput() {
  $('output').innerHTML = renderAnnotated(state.text, state.spans, state.activeCats);
}

function renderStats() {
  const text = state.text;
  const cov = computeCoverage(text, state.spans, state.activeCats);
  const words = (text.match(/\p{L}+/gu) || []).length;
  const warn = cov.pct > 45;
  const ok = cov.pct >= 5 && cov.pct <= 35;
  const box = $('stats');
  box.style.display = 'grid';
  box.innerHTML = `
    <div class="stat ${warn ? 'warn' : (ok ? 'ok' : '')}"><div class="k">Copertura</div><div class="v">${cov.pct}%</div></div>
    <div class="stat"><div class="k">Parole</div><div class="v">${words.toLocaleString('it-IT')}</div></div>
    <div class="stat"><div class="k">Evidenze</div><div class="v">${cov.count}</div></div>
  `;
}

function initResize() {
  const ta = $('input');
  const handle = $('resizeHandle');
  const saved = parseInt(localStorage.getItem(INPUT_H_KEY) || '0', 10);
  if (saved && saved >= 80 && saved <= 2000) ta.style.height = saved + 'px';

  let dragging = false, startY = 0, startH = 0;
  const onDown = e => {
    e.preventDefault();
    dragging = true; startY = e.clientY; startH = ta.offsetHeight;
    handle.classList.add('dragging');
    try { handle.setPointerCapture(e.pointerId); } catch {}
    vibrate(5);
  };
  const onMove = e => {
    if (!dragging) return;
    const dy = e.clientY - startY;
    ta.style.height = Math.max(80, Math.min(2000, startH + dy)) + 'px';
  };
  const onUp = e => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    try { handle.releasePointerCapture(e.pointerId); } catch {}
    localStorage.setItem(INPUT_H_KEY, String(ta.offsetHeight));
  };
  handle.addEventListener('pointerdown', onDown);
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onUp);
  handle.addEventListener('lostpointercapture', onUp);
}

function clearSearchHits() {
  $('output').querySelectorAll('mark.search-hit').forEach(m => {
    const p = m.parentNode;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
    p.normalize();
  });
  state.searchHits = [];
  state.searchIdx = -1;
  $('searchCount').textContent = '';
}

function runSearch(q) {
  clearSearchHits();
  if (!q || q.length < 2) return;
  const out = $('output');
  const re = new RegExp(escapeRE(q), 'gi');
  const walker = document.createTreeWalker(out, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);

  for (const node of nodes) {
    const s = node.nodeValue;
    let m;
    re.lastIndex = 0;
    const matches = [];
    while ((m = re.exec(s)) !== null) {
      matches.push([m.index, m.index + m[0].length]);
      if (m[0].length === 0) re.lastIndex++;
    }
    if (!matches.length) continue;
    const frag = document.createDocumentFragment();
    let cur = 0;
    for (const [a, b] of matches) {
      if (a > cur) frag.appendChild(document.createTextNode(s.slice(cur, a)));
      const mk = document.createElement('mark');
      mk.className = 'search-hit';
      mk.textContent = s.slice(a, b);
      frag.appendChild(mk);
      cur = b;
    }
    if (cur < s.length) frag.appendChild(document.createTextNode(s.slice(cur)));
    node.parentNode.replaceChild(frag, node);
  }

  state.searchHits = [...out.querySelectorAll('mark.search-hit')];
  $('searchCount').textContent = state.searchHits.length ? `1/${state.searchHits.length}` : '0';
  if (state.searchHits.length) { state.searchIdx = 0; focusHit(); }
}

function focusHit() {
  state.searchHits.forEach((h, i) => h.classList.toggle('current', i === state.searchIdx));
  const h = state.searchHits[state.searchIdx];
  if (h) h.scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('searchCount').textContent = `${state.searchIdx + 1}/${state.searchHits.length}`;
}

function renderLibrary(filter = '') {
  const list = $('libList');
  const empty = $('libEmpty');
  list.innerHTML = '';
  let items = [...state.library].sort((a, b) => b.updatedAt - a.updatedAt);
  if (filter.trim()) {
    const f = filter.toLowerCase();
    items = items.filter(it => it.title.toLowerCase().includes(f) || it.text.toLowerCase().includes(f));
  }
  if (!items.length) {
    empty.style.display = 'block';
    empty.querySelector('.title').textContent = filter ? 'Nessun risultato' : 'Libreria vuota';
    empty.querySelector('.sub').textContent = filter ? 'Prova con altre parole chiave.' : 'Salva un testo annotato per ritrovarlo qui, anche offline.';
    return;
  }
  empty.style.display = 'none';
  for (const it of items) {
    const el = document.createElement('div');
    el.className = 'lib-item';
    const date = new Date(it.updatedAt).toLocaleDateString('it-IT', { day:'2-digit', month:'short' });
    const snippet = it.text.slice(0, 160).replace(/\s+/g, ' ');
    el.innerHTML = `
      <div class="row1">
        <span class="badge">${(it.lang || 'xx').toUpperCase()}</span>
        <span class="date">${date}</span>
      </div>
      <div class="title">${escapeHTML(it.title || 'Senza titolo')}</div>
      <div class="snippet">${escapeHTML(snippet)}…</div>
      <div class="meta">
        <span>${(it.text.match(/\p{L}+/gu) || []).length} parole</span>
        <span>copertura ${it.pct ?? '—'}%</span>
      </div>`;
    el.addEventListener('click', () => openFromLibrary(it.id));
    el.addEventListener('contextmenu', e => { e.preventDefault(); askDelete(it.id); });
    let t;
    el.addEventListener('touchstart', () => { t = setTimeout(() => { askDelete(it.id); vibrate(15); }, 600); }, { passive: true });
    el.addEventListener('touchend', () => clearTimeout(t));
    el.addEventListener('touchmove', () => clearTimeout(t));
    list.appendChild(el);
  }
}

function openFromLibrary(id) {
  const it = state.library.find(x => x.id === id);
  if (!it) return;
  state.text = it.text;
  state.currentLibId = it.id;
  $('input').value = it.text;
  runAnalyze();
  switchView('annotate');
  $('scrollAnnotate').scrollTop = 0;
  toast('Aperto dalla libreria');
}

function askDelete(id) {
  const it = state.library.find(x => x.id === id);
  if (!it) return;
  $('confirmTitle').textContent = 'Eliminare il testo?';
  $('confirmText').textContent = `"${it.title || 'Senza titolo'}" verrà rimosso dalla libreria.`;
  openModal('modalConfirm');
  $('btnOkConfirm').onclick = () => {
    state.library = state.library.filter(x => x.id !== id);
    saveLibrary(state.library);
    renderLibrary($('libSearch').value);
    closeModal('modalConfirm');
    toast('Eliminato');
    vibrate(10);
  };
}

function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});

function saveToLibrary() {
  if (!state.text.trim()) { toast('Nulla da salvare'); return; }
  const suggested = state.text.trim().slice(0, 60).replace(/\s+/g, ' ').replace(/[.,;:!?]+$/, '');
  $('saveTitle').value = state.library.find(x => x.id === state.currentLibId)?.title || suggested;
  openModal('modalSave');
  setTimeout(() => $('saveTitle').focus(), 100);
}

function confirmSave() {
  const title = $('saveTitle').value.trim() || state.text.trim().slice(0, 60).replace(/\s+/g, ' ');
  const cov = computeCoverage(state.text, state.spans, state.activeCats);

  if (state.currentLibId) {
    const it = state.library.find(x => x.id === state.currentLibId);
    if (it) Object.assign(it, { title, text: state.text, lang: state.lang, pct: cov.pct, updatedAt: Date.now() });
  } else {
    const id = uid();
    state.library.push({ id, title, text: state.text, lang: state.lang, pct: cov.pct, createdAt: Date.now(), updatedAt: Date.now() });
    state.currentLibId = id;
  }
  saveLibrary(state.library);
  closeModal('modalSave');
  toast('Salvato in libreria');
  vibrate(10);
}

async function shareOrExport() {
  if (!state.text.trim()) { toast('Nulla da condividere'); return; }
  const html = buildExportHTML();
  const blob = new Blob([html], { type: 'text/html' });
  const file = new File([blob], `annotazione-${Date.now()}.html`, { type: 'text/html' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Annotazione', text: state.text.slice(0, 120) }); return; } catch {}
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `annotazione-${Date.now()}.html`;
  a.click();
  URL.revokeObjectURL(url);
  toast('File esportato');
}

function buildExportHTML() {
  const annotated = renderAnnotated(state.text, state.spans, state.activeCats);
  const styles = `
    body{font-family:Georgia,serif;max-width:720px;margin:32px auto;padding:0 20px;line-height:1.8;font-size:1.08rem;color:#1b1815;background:#faf7f2}
    h1{font-size:1.1rem;font-family:system-ui;color:#8a8178;font-weight:600;margin-bottom:4px}
    .meta{font-family:system-ui;font-size:.78rem;color:#8a8178;margin-bottom:24px}
    mark{padding:1px 0;border-radius:3px;background:transparent;color:inherit}
    mark.c-num{background:#ffe680} mark.c-name{background:#d9b8ff}
    mark.c-key{background:#b6e6b6} mark.c-quote{background:#ffc1cf}
    mark.c-list{background:#a9d8ff} mark.c-sentence{background:#ffc9a0}
  `;
  return `<!doctype html><html lang="${state.lang}"><head><meta charset="utf-8"><title>Annotazione</title>
<style>${styles}</style></head><body>
<h1>Annota · ${new Date().toLocaleString('it-IT')}</h1>
<div class="meta">Lingua rilevata: ${state.lang.toUpperCase()}</div>
<div>${annotated}</div>
</body></html>`;
}

function switchView(v) {
  state.view = v;
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  $$('.tabbar .tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));

}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem(THEME_KEY, t);
  document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#14110f' : '#f6f3ee');
}

function toggleSearch() {
  const bar = $('searchBar');
  const on = bar.style.display === 'none';
  bar.style.display = on ? 'flex' : 'none';
  if (on) setTimeout(() => $('searchInput').focus(), 80);
  else { $('searchInput').value = ''; clearSearchHits(); }
}

function updateReadProgress() {
  const el = $('scrollAnnotate');
  const max = el.scrollHeight - el.clientHeight;
  const p = max > 0 ? (el.scrollTop / max) * 100 : 0;
  $('readProgress').style.width = p + '%';
}

function bindEvents() {
  $('btnTheme').addEventListener('click', () => {
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    vibrate(5);
  });
  $('btnShare').addEventListener('click', shareOrExport);

  $$('.tabbar .tab').forEach(t => {
    t.addEventListener('click', () => { switchView(t.dataset.view); vibrate(5); });
  });

  const input = $('input');
  let timer = null;
  input.addEventListener('input', () => {
    state.text = input.value;
    state.currentLibId = null;
    clearTimeout(timer);
    timer = setTimeout(() => { if (state.text.trim().length > 60) runAnalyze(); }, 500);
  });

  $('btnAnalyze').addEventListener('click', () => { runAnalyze(); vibrate(10); });
  $('btnClear').addEventListener('click', () => {
    input.value = '';
    state.text = ''; state.spans = []; state.currentLibId = null;
    $('output').innerHTML = '';
    $('stats').style.display = 'none';
    localStorage.removeItem(SES_KEY);
    vibrate(10);
  });

  $('btnSaveLib').addEventListener('click', saveToLibrary);
  $('btnReading').addEventListener('click', () => {
    document.body.classList.add('reading');
    window.scrollTo(0, 0);

  });
  $('btnExitReading').addEventListener('click', () => {
    document.body.classList.remove('reading');
    document.exitFullscreen?.().catch(()=>{});
  });
  $('btnSearchOpen').addEventListener('click', toggleSearch);
  $('btnSearchReading').addEventListener('click', toggleSearch);
  $('btnCopy').addEventListener('click', async () => {
    if (!state.text) return;
    try {
      const html = buildExportHTML();
      if (navigator.clipboard && window.ClipboardItem) {
        const item = new ClipboardItem({
          'text/plain': new Blob([$('output').innerText], { type: 'text/plain' }),
          'text/html': new Blob([html], { type: 'text/html' })
        });
        await navigator.clipboard.write([item]);
      } else {
        await navigator.clipboard.writeText($('output').innerText);
      }
      toast('Copiato');
    } catch { toast('Copia non disponibile'); }
  });

  $('saveTitle').addEventListener('keydown', e => { if (e.key === 'Enter') confirmSave(); });

  $('searchInput').addEventListener('input', e => runSearch(e.target.value));
  $('btnSearchClose').addEventListener('click', () => {
    $('searchBar').style.display = 'none';
    clearSearchHits();
  });
  $('searchCount').addEventListener('click', () => {
    if (!state.searchHits.length) return;
    state.searchIdx = (state.searchIdx + 1) % state.searchHits.length;
    focusHit();
  });

  $('libSearch').addEventListener('input', e => renderLibrary(e.target.value));
  $('scrollAnnotate').addEventListener('scroll', updateReadProgress, { passive: true });
}

function init() {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) setTheme(savedTheme);
  else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) setTheme('dark');

  let restored = false;
  try {
    const s = JSON.parse(localStorage.getItem(SES_KEY) || 'null');
    if (s && s.text && Date.now() - s.ts < 1000*60*60*24*7) {
      state.text = s.text;
      $('input').value = s.text;
      restored = true;
    }
  } catch {}

  if (!restored) {
    const sample = `La Rivoluzione Francese, iniziata nel 1789 con la presa della Bastiglia, rappresentò un momento di rottura con l'Antico Regime. Le cause furono molteplici: la crisi finanziaria dello Stato, le cattive condizioni di vita del Terzo Stato e la diffusione delle idee illuministe.

Di conseguenza, il 14 luglio 1789 il popolo parigino insorse contro la monarchia. La Dichiarazione dei Diritti dell'Uomo e del Cittadino, approvata nell'agosto dello stesso anno, costituisce uno dei documenti fondamentali della storia moderna.

Napoleone Bonaparte prese il potere nel 1799 con il colpo di Stato del 18 brumaio, ponendo fine alla fase rivoluzionaria. Il Consolato, instaurato nel 1799, diede origine a un nuovo ordine istituzionale che portò alla proclamazione dell'Impero nel 1804.`;
    state.text = sample;
    $('input').value = sample;
  }

  renderLegend();
  bindEvents();
  initResize();
  runAnalyze();
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
