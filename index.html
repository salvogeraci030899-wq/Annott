<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard AI</title>
<style>
  body{font-family:system-ui;margin:2rem;max-width:1100px}
  textarea,input{width:100%;box-sizing:border-box;margin:.2rem 0;padding:.5rem}
  .ai{border:1px solid #ccc;padding:.6rem;margin:.5rem 0;border-radius:8px}
  .grid{display:grid;grid-template-columns:1fr 2fr 1fr 1fr auto;gap:.4rem;align-items:center}
  .card{border:1px solid #ddd;padding:1rem;margin:1rem 0;border-radius:8px}
  pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>Dashboard multi-AI</h1>
<p><small>Prototipo: le chiavi restano nel browser. Non condividerlo con chiavi dentro.</small></p>

<textarea id="prompt" rows="4" placeholder="Scrivi il comando da inviare a tutti gli AI..."></textarea>
<div id="ais"></div>
<p>
  <button onclick="addAI()">+ Aggiungi AI</button>
  <button onclick="sendAll()">Invia a tutti</button>
</p>
<div id="out"></div>

<script>
let ais = [
  { name:"OpenAI", endpoint:"https://api.openai.com/v1/chat/completions", key:"", model:"gpt-4o-mini" }
];

function render() {
  const box = document.getElementById('ais');
  box.innerHTML = '';
  ais.forEach((ai, i) => {
    const div = document.createElement('div');
    div.className = 'ai';
    div.innerHTML = `
      <div class="grid">
        <input value="${escapeAttr(ai.name)}" placeholder="Nome" oninput="ais[${i}].name=this.value">
        <input value="${escapeAttr(ai.endpoint)}" placeholder="Endpoint /chat/completions" oninput="ais[${i}].endpoint=this.value">
        <input value="${escapeAttr(ai.key)}" placeholder="API key" type="password" oninput="ais[${i}].key=this.value">
        <input value="${escapeAttr(ai.model)}" placeholder="Modello" oninput="ais[${i}].model=this.value">
        <button onclick="ais.splice(${i},1);render()">X</button>
      </div>`;
    box.appendChild(div);
  });
}

function escapeAttr(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function addAI() {
  ais.push({ name:"Nuovo", endpoint:"", key:"", model:"" });
  render();
}

async function ask(ai, prompt) {
  if (!ai.endpoint) throw new Error("Endpoint mancante");
  const res = await fetch(ai.endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + ai.key
    },
    body: JSON.stringify({
      model: ai.model,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const text = await res.text();
  if (!res.ok) throw new Error(text);
  const data = JSON.parse(text);
  return data.choices?.[0]?.message?.content ?? text;
}

async function sendAll() {
  const prompt = document.getElementById('prompt').value;
  const out = document.getElementById('out');
  out.innerHTML = '';
  await Promise.all(ais.map(async (ai) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${escapeAttr(ai.name)}</h3><pre>In attesa...</pre>`;
    out.appendChild(card);
    const pre = card.querySelector('pre');
    try {
      pre.textContent = await ask(ai, prompt);
    } catch (e) {
      pre.textContent = "ERRORE: " + e.message;
    }
  }));
}

render();
</script>
</body>
</html>
